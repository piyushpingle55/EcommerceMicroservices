version: '3.8'

networks:
  ecommerce-net:
    driver: bridge

services:
  # 1. Log Storage Engine
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ecommerce-net

  # 2. Visualization & Dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ecommerce-net
    depends_on:
      - loki

  # 3. Production Log Collector (Scrapes container stdout)
  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    networks:
      - ecommerce-net
    depends_on:
      - loki

  # 4. Your Microservice Running in Production Container Mode
  product-service:
    build:
      context: ./src/Services/ProductService
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    labels:
      - "service_name=ProductService"
    networks:
      - ecommerce-net
    depends_on:
      - alloy